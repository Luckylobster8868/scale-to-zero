apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 0   # starts at zero. KEDA changes this number automatically.
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: scale-app:1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
