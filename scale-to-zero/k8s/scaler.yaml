apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaler
spec:
  scaleTargetRef:
    name: worker          # the Deployment to scale
  minReplicaCount: 0      # scale to zero when the queue is empty
  maxReplicaCount: 5
  pollingInterval: 5      # check the queue every 5 seconds
  cooldownPeriod: 30      # wait 30s of empty queue before going to zero
  triggers:
    - type: redis
      metadata:
        address: redis.default.svc.cluster.local:6379
        listName: jobs
        listLength: "3"   # roughly 1 worker per 3 waiting jobs
